# Контрактные тесты C7: scripts/ci/contract-test.sh (schemathesis 4.28.0).

# Корректный по схеме запрос может быть отвергнут по смыслу, и это задокументировано в openapi.yaml:
# 422 — в строке нет номера документа (схема разрешает любую строку), 404 — нет такой записи или истории,
# 409 — документ уже на контроле, 413/415 — файл больше лимитов или не PDF, 429 — лимит 30 проверок в минуту на
# пользователя (АРХ §10): проверки, файлы и импорт расходуют его вместе, и прогон одним пользователем его исчерпывает.
[checks.positive_data_acceptance]
expected-statuses = ["2xx", "404", "409", "413", "415", "422", "429"]
